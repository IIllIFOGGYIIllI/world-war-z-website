<script>
(() => {
  // Preserve old shared links, rental picker coordinates and server scope.
  const url=new URL('../map-link.html',location.href);
  const prior=new URLSearchParams(location.search);
  for(const [key,value] of prior)if(key!=='map')url.searchParams.append(key,value);
  url.searchParams.set('map','badlands');
  location.replace(url.href);
})();
</script>

name: Deploy World War Z Website

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build WWZ Companion Android
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website artifact
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Build Nasdara community app icons
        run: |
          python3 -m pip install Pillow==12.0.0
          python3 scripts/build_community_icons.py
          python3 scripts/test_community_icons.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Validate static website
        run: |
          python3 scripts/validate_pwa_revision.py
          python3 scripts/validate_site.py --require-map-assets
          node scripts/test_nasdara_scoped_auth_errors_stage2f.js
          node scripts/test_shop_checkout_retries.js
          node scripts/test_nasdara_scoped_panels.js
          node scripts/test_nasdara_scoped_objectives.js
          node scripts/test_rental_map_and_server_labels.js
          node scripts/test_identity_sync_scope.js
          node scripts/test_operation_failure_scope.js
          node scripts/test_operations_centre_2.js
          node scripts/test_command_centre_scope.js
          node scripts/test_ui_polish_consistency.js
          node scripts/test_ios_auth_handoff.js
          node scripts/test_mobile_dashboard_reliability.js
          node scripts/test_action_centre_scope_refresh.js
          node scripts/test_stage5_qol.js
          node scripts/test_phase2_shop_reliability.js
          node scripts/test_stage6_raid_calendar.js
          node scripts/test_stage6_raid_automation_ui.js
          node scripts/test_raid_lifecycle_status_ui.js
          node scripts/test_raid_preflight_ui.js
          node scripts/test_raid_recovery_ui.js
          node scripts/test_raid_owner_review_ui.js
          node scripts/test_community_event_recovery.js
          node scripts/test_zone_save_fix.js
          node scripts/test_zone_submit_validation.js
          node scripts/test_zone_manual_coordinates.js
          find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: Deploy website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

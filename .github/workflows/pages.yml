name: Deploy World War Z Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Validate static website
        run: |
          python3 scripts/validate_pwa_revision.py
          python3 scripts/validate_site.py --require-map-assets
          find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: Deploy website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

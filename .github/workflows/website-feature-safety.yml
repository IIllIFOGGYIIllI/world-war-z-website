name: Website Feature Safety (No Deploy)
on:
  push:
    branches:
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check all JavaScript parses
        run: find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate rollout and protected storefront flows
        run: |
          python3 scripts/validate_pwa_revision.py
          node scripts/test_shop_checkout_retries.js
          node scripts/test_survivor_profile_statistics.js
          node scripts/test_rental_map_and_server_labels.js
          node scripts/test_rental_portfolio_gps_performance.js
          node scripts/test_ui_polish_consistency.js
          node scripts/test_v2_navigation.js
          node scripts/test_site_refinement.js
          node scripts/test_dashboard_workspace_phase2.js
          node scripts/test_navigation_v31.js
          node scripts/test_workspace_v32_profile_gps.js
          node scripts/test_workspace_v32_economy.js
          node scripts/test_workspace_v32_community.js
          node scripts/test_workspace_v33_administration.js
          node scripts/test_sitewide_v34.js
          node scripts/test_full_site_v35.js
          node scripts/test_public_page_v36.js
          node scripts/test_dashboard_shell_v37.js
          node scripts/test_overview_v38.js
          node scripts/test_dashboard_layout_v39.js
          node scripts/test_sidebar_v310.js
          node scripts/test_workspace_v311.js
          node scripts/test_command_centre_v3.js
      - name: Build generated Nasdara map assets for full site check
        run: |
          python3 -m pip install Pillow==12.0.0
          python3 scripts/build_nasdara_assets.py
      - name: Validate page routing and script assets
        run: python3 scripts/validate_site.py --require-map-assets

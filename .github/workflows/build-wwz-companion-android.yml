name: Build WWZ Companion Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "companion-v*"
    paths:
      - "android-app/**"
      - ".github/workflows/build-wwz-companion-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BUBBLEWRAP_VERSION: "1.25.0"
      WWZ_ANDROID_KEYSTORE_BASE64: ${{ secrets.WWZ_ANDROID_KEYSTORE_BASE64 }}
      WWZ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WWZ_ANDROID_KEYSTORE_PASSWORD }}
      WWZ_ANDROID_KEY_PASSWORD: ${{ secrets.WWZ_ANDROID_KEY_PASSWORD }}
      WWZ_ANDROID_KEY_ALIAS: ${{ secrets.WWZ_ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Bubblewrap
        run: npm install --global "@bubblewrap/cli@${BUBBLEWRAP_VERSION}"

      - name: Read Companion version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          data = json.loads(Path('android-app/twa-manifest.json').read_text(encoding='utf-8'))
          version = str(data['appVersion'])
          code = int(data['appVersionCode'])
          print(f'WWZ_COMPANION_VERSION={version}')
          print(f'WWZ_COMPANION_VERSION_CODE={code}')
          PY

      - name: Prepare Bubblewrap Android SDK
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_ANDROID_SDK="$ANDROID_HOME"
          SOURCE_SDKMANAGER="$(find "$RUNNER_ANDROID_SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)"
          if [ -z "$SOURCE_SDKMANAGER" ]; then
            echo "Could not locate sdkmanager under $RUNNER_ANDROID_SDK/cmdline-tools" >&2
            find "$RUNNER_ANDROID_SDK" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          SOURCE_CMDLINE_ROOT="$(cd "$(dirname "$SOURCE_SDKMANAGER")/.." && pwd)"
          WWZ_SDK="$RUNNER_TEMP/wwz-bubblewrap-sdk"
          rm -rf "$WWZ_SDK"
          mkdir -p "$WWZ_SDK"
          cp -a "$SOURCE_CMDLINE_ROOT/." "$WWZ_SDK/"

          { yes || true; } | "$WWZ_SDK/bin/sdkmanager" --licenses --sdk_root="$WWZ_SDK" >/dev/null
          "$WWZ_SDK/bin/sdkmanager" \
            --sdk_root="$WWZ_SDK" \
            "build-tools;34.0.0" \
            "platforms;android-36" \
            "platform-tools"

          mkdir -p "$HOME/.bubblewrap"
          python3 - "$WWZ_SDK" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sdk = sys.argv[1]
          config = {"jdkPath": os.environ["JAVA_HOME"], "androidSdkPath": sdk}
          path = Path.home() / ".bubblewrap" / "config.json"
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          print(f"Configured Bubblewrap: {path}")
          PY

          echo "WWZ_BUBBLEWRAP_SDK=$WWZ_SDK" >> "$GITHUB_ENV"
          echo "WWZ_RUNNER_ANDROID_SDK=$RUNNER_ANDROID_SDK" >> "$GITHUB_ENV"
          bubblewrap doctor

      - name: Validate Nasdara app icon source
        shell: bash
        run: |
          python3 -m pip install Pillow==12.0.0
          python3 scripts/build_community_icons.py
          python3 scripts/test_community_icons.py

      - name: Generate Android project
        working-directory: android-app
        run: bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json

      - name: Use runner SDK for Gradle
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$WWZ_RUNNER_ANDROID_SDK" > local.properties

      - name: Ensure Gradle wrapper executable
        working-directory: android-app
        run: chmod +x ./gradlew

      - name: Build debug APK
        if: ${{ env.WWZ_ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: android-app
        env:
          ANDROID_HOME: ${{ env.WWZ_RUNNER_ANDROID_SDK }}
          ANDROID_SDK_ROOT: ${{ env.WWZ_RUNNER_ANDROID_SDK }}
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: ${{ env.WWZ_ANDROID_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: wwz-companion-v${{ env.WWZ_COMPANION_VERSION }}-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Require signing key for main release
        if: ${{ github.ref == 'refs/heads/main' && env.WWZ_ANDROID_KEYSTORE_BASE64 == '' }}
        shell: bash
        run: |
          echo "WWZ Android signing secrets are required to publish the public Companion release from main." >&2
          exit 1

      - name: Restore release signing key
        if: ${{ env.WWZ_ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android-app
        shell: bash
        run: |
          printf '%s' "$WWZ_ANDROID_KEYSTORE_BASE64" | base64 --decode > android-keystore
          chmod 600 android-keystore

      - name: Build signed APK and App Bundle
        if: ${{ env.WWZ_ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android-app
        shell: bash
        env:
          ANDROID_HOME: ${{ env.WWZ_RUNNER_ANDROID_SDK }}
          ANDROID_SDK_ROOT: ${{ env.WWZ_RUNNER_ANDROID_SDK }}
        run: |
          if [ -z "$WWZ_ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$WWZ_ANDROID_KEY_PASSWORD" ] || [ -z "$WWZ_ANDROID_KEY_ALIAS" ]; then
            echo "Signing key is configured but one or more signing secrets are missing." >&2
            exit 1
          fi

          export BUBBLEWRAP_KEYSTORE_PASSWORD="$WWZ_ANDROID_KEYSTORE_PASSWORD"
          export BUBBLEWRAP_KEY_PASSWORD="$WWZ_ANDROID_KEY_PASSWORD"

          bubblewrap build \
            --skipPwaValidation \
            --manifest=twa-manifest.json \
            --signingKeyPath=android-keystore \
            --signingKeyAlias="$WWZ_ANDROID_KEY_ALIAS"

      - name: Prepare direct-download package
        if: ${{ env.WWZ_ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ROOT="$RUNNER_TEMP/wwz-companion-release"
          rm -rf "$RELEASE_ROOT"
          python3 scripts/package_release.py \
            --apk app-release-signed.apk \
            --manifest twa-manifest.json \
            --output-root "$RELEASE_ROOT"
          mkdir -p "$RELEASE_ROOT/native-artifacts"
          cp app-release-bundle.aab "$RELEASE_ROOT/native-artifacts/World-War-Z-Companion-v${WWZ_COMPANION_VERSION}.aab"
          python3 - "$WWZ_RUNNER_ANDROID_SDK" "$RELEASE_ROOT/native-artifacts/assetlinks.json" <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path
          from scripts.package_release import SIGNING_CERT_SHA256
          sdk = Path(sys.argv[1])
          output = sys.argv[2]
          tools = sorted(sdk.glob("build-tools/*/apksigner"))
          if not tools:
              raise SystemExit("Android apksigner is missing; cannot verify the signed APK")
          details = subprocess.check_output([str(tools[-1]), "verify", "--print-certs", "app-release-signed.apk"], text=True)
          expected = SIGNING_CERT_SHA256.replace(":", "").lower()
          # apksigner versions differ: some separate digest bytes with colons.
          # Normalise separators while still requiring the exact pinned signing SHA-256.
          printed_hex = re.sub(r"[^0-9a-f]", "", details.lower())
          if expected not in printed_hex:
              certificate_lines = [line for line in details.splitlines() if "certificate" in line.lower() and "sha" in line.lower()]
              print("APK certificate details:", *certificate_lines[:4], sep="\n")
              raise SystemExit("The APK signing certificate does not match the established WWZ update certificate")
          subprocess.check_call([sys.executable, "scripts/generate_assetlinks.py", SIGNING_CERT_SHA256, "--output", output])
          print("PASS: verified signed APK certificate and generated Digital Asset Links")
          PY
          echo "WWZ_RELEASE_ROOT=$RELEASE_ROOT" >> "$GITHUB_ENV"

      - name: Publish stable GitHub release
        if: ${{ env.WWZ_ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="companion-v${WWZ_COMPANION_VERSION}"
          TITLE="WWZ Companion v${WWZ_COMPANION_VERSION}"
          APK="$WWZ_RELEASE_ROOT/downloads/android/World-War-Z-Companion-v${WWZ_COMPANION_VERSION}.apk"
          ZIP="$WWZ_RELEASE_ROOT/downloads/android/World-War-Z-Companion-v${WWZ_COMPANION_VERSION}.zip"
          STABLE_APK="$WWZ_RELEASE_ROOT/downloads/android/World-War-Z-Companion.apk"
          STABLE_ZIP="$WWZ_RELEASE_ROOT/downloads/android/World-War-Z-Companion.zip"
          NOTES="Official signed World War Z Companion Android release. Website/PWA feature updates continue to arrive separately through the live WWZ service worker."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
            gh release upload "$TAG" "$APK" "$ZIP" "$STABLE_APK" "$STABLE_ZIP" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" "$APK" "$ZIP" "$STABLE_APK" "$STABLE_ZIP" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Publish release metadata to website
        if: ${{ env.WWZ_ANDROID_KEYSTORE_BASE64 != '' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          # The Android build may overlap website commits. Publish on the latest main.
          git fetch origin main
          git reset --hard origin/main
          cp "$WWZ_RELEASE_ROOT/assets/data/companion-release.json" assets/data/companion-release.json
          mkdir -p .well-known
          cp "$WWZ_RELEASE_ROOT/native-artifacts/assetlinks.json" .well-known/assetlinks.json
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          target = Path('sw.js')
          source = target.read_text(encoding='utf-8')
          version = os.environ['WWZ_COMPANION_VERSION'].replace('.', '-')
          revision = 'companion-{}-run-{}-{}'.format(version, os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'])
          patterns = (
              (r"^const WWZ_PWA_UPDATE_REVISION = '[^']+';$", "const WWZ_PWA_UPDATE_REVISION = '{}';".format(revision)),
              (r"^const APP_CACHE_RELEASE = .+;$", "const APP_CACHE_RELEASE = `${WWZ_PWA_VERSION}-%s`;" % revision),
          )
          for pattern, replacement in patterns:
              source, count = re.subn(pattern, lambda match: replacement, source, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit('Could not safely refresh PWA cache revision for Android release')
          target.write_text(source, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/companion-release.json sw.js .well-known/assetlinks.json
          if git diff --cached --quiet; then
            echo "Companion release metadata is already current."
          else
            git commit -m "Update Companion release metadata"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload signed Android release
        if: ${{ env.WWZ_ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: wwz-companion-v${{ env.WWZ_COMPANION_VERSION }}-android
          path: ${{ env.WWZ_RELEASE_ROOT }}
          if-no-files-found: error
          retention-days: 90

name: Build WWZ Companion Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-wwz-companion-android.yml"
    tags:
      - "companion-v*"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BUBBLEWRAP_VERSION: "1.25.0"
      WWZ_ANDROID_KEYSTORE_BASE64: ${{ secrets.WWZ_ANDROID_KEYSTORE_BASE64 }}
      WWZ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WWZ_ANDROID_KEYSTORE_PASSWORD }}
      WWZ_ANDROID_KEY_PASSWORD: ${{ secrets.WWZ_ANDROID_KEY_PASSWORD }}
      WWZ_ANDROID_KEY_ALIAS: ${{ secrets.WWZ_ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Bubblewrap
        run: npm install --global "@bubblewrap/cli@${BUBBLEWRAP_VERSION}"

      - name: Prepare Bubblewrap Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)"
          if [ -z "$SOURCE_SDKMANAGER" ]; then
            echo "Could not locate sdkmanager under $ANDROID_HOME/cmdline-tools" >&2
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          SOURCE_CMDLINE_ROOT="$(cd "$(dirname "$SOURCE_SDKMANAGER")/.." && pwd)"
          WWZ_SDK="$RUNNER_TEMP/wwz-bubblewrap-sdk"
          rm -rf "$WWZ_SDK"
          mkdir -p "$WWZ_SDK"
          cp -a "$SOURCE_CMDLINE_ROOT/." "$WWZ_SDK/"

          echo "Bubblewrap SDK root: $WWZ_SDK"
          echo "Command-line tools: $SOURCE_CMDLINE_ROOT"

          { yes || true; } | "$WWZ_SDK/bin/sdkmanager" --licenses --sdk_root="$WWZ_SDK" >/dev/null
          "$WWZ_SDK/bin/sdkmanager" \
            --sdk_root="$WWZ_SDK" \
            "build-tools;34.0.0" \
            "platforms;android-36" \
            "platform-tools"

          mkdir -p "$HOME/.bubblewrap"
          python3 - "$WWZ_SDK" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sdk = sys.argv[1]
          config = {
              "jdkPath": os.environ["JAVA_HOME"],
              "androidSdkPath": sdk,
          }
          path = Path.home() / ".bubblewrap" / "config.json"
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          print(f"Configured Bubblewrap: {path}")
          print(f"JDK: {config['jdkPath']}")
          print(f"Android SDK: {config['androidSdkPath']}")
          PY

          echo "WWZ_BUBBLEWRAP_SDK=$WWZ_SDK" >> "$GITHUB_ENV"
          bubblewrap doctor

      - name: Generate Android project
        working-directory: android-app
        run: bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json

      - name: Ensure Gradle wrapper executable
        working-directory: android-app
        run: chmod +x ./gradlew

      - name: Build debug APK
        if: ${{ env.WWZ_ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: android-app
        env:
          ANDROID_HOME: ${{ env.WWZ_BUBBLEWRAP_SDK }}
          ANDROID_SDK_ROOT: ${{ env.WWZ_BUBBLEWRAP_SDK }}
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: ${{ env.WWZ_ANDROID_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: wwz-companion-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Restore release signing key
        if: ${{ env.WWZ_ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android-app
        shell: bash
        run: |
          printf '%s' "$WWZ_ANDROID_KEYSTORE_BASE64" | base64 --decode > android-keystore
          chmod 600 android-keystore

      - name: Build signed APK and App Bundle
        if: ${{ env.WWZ_ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android-app
        shell: bash
        env:
          ANDROID_HOME: ${{ env.WWZ_BUBBLEWRAP_SDK }}
          ANDROID_SDK_ROOT: ${{ env.WWZ_BUBBLEWRAP_SDK }}
        run: |
          if [ -z "$WWZ_ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$WWZ_ANDROID_KEY_PASSWORD" ] || [ -z "$WWZ_ANDROID_KEY_ALIAS" ]; then
            echo "Signing key is configured but one or more signing secrets are missing." >&2
            exit 1
          fi

          export BUBBLEWRAP_KEYSTORE_PASSWORD="$WWZ_ANDROID_KEYSTORE_PASSWORD"
          export BUBBLEWRAP_KEY_PASSWORD="$WWZ_ANDROID_KEY_PASSWORD"

          bubblewrap build \
            --skipPwaValidation \
            --manifest=twa-manifest.json \
            --signingKeyPath=android-keystore \
            --signingKeyAlias="$WWZ_ANDROID_KEY_ALIAS"

      - name: Upload signed Android release
        if: ${{ env.WWZ_ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: wwz-companion-v1.0.0-android
          path: |
            android-app/app-release-signed.apk
            android-app/app-release-bundle.aab
            android-app/assetlinks.json
          if-no-files-found: warn
          retention-days: 90

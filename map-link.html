<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex,nofollow">
  <title>WWZ Detection Map</title>
  <link rel="icon" href="assets/world-war-z-logo.webp">
  <link href="manifest.webmanifest" rel="manifest"/>
  <link rel="apple-touch-icon" href="assets/icons/pwa/apple-touch-icon-180.png?v=1.22.93">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/pwa.css?v=1.22.93">
  <link rel="stylesheet" href="assets/css/site-polish.css?v=1.22.93">
  <link rel="stylesheet" href="assets/css/components/chernarus-map.css?v=1.22.93&rev=2">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#070707; color:#f3eee7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at top, rgba(213,43,30,.14), transparent 36rem), #070707; }
    .marker-shell { width:min(1500px, 100%); min-height:100vh; margin:0 auto; padding:24px; display:grid; grid-template-rows:auto minmax(560px,1fr) auto; gap:16px; }
    .marker-header,.marker-footer,.marker-card { border:1px solid rgba(255,255,255,.1); background:rgba(15,15,15,.94); box-shadow:0 18px 60px rgba(0,0,0,.35); }
    .marker-header { border-radius:18px; padding:18px 20px; display:flex; align-items:center; gap:14px; }
    .marker-header img { width:52px; height:52px; border-radius:50%; object-fit:cover; }
    .marker-header-copy { min-width:0; flex:1; }
    .marker-kicker { margin:0 0 3px; color:#e65a4f; font-size:.72rem; font-weight:800; letter-spacing:.15em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(1.15rem,2vw,1.65rem); }
    .marker-subtitle { margin:5px 0 0; color:#afa79e; }
    .marker-card { position:relative; overflow:hidden; border-radius:20px; min-height:560px; }
    #wwz-detection-map { position:absolute; inset:0; min-height:560px; }
    .marker-controls { position:absolute; z-index:900; top:16px; left:16px; display:flex; gap:8px; }
    .marker-controls button,.copy-link { border:1px solid rgba(255,255,255,.15); background:rgba(10,10,10,.9); color:#fff; border-radius:10px; min-width:42px; height:42px; padding:0 12px; font:inherit; font-weight:800; cursor:pointer; backdrop-filter:blur(8px); }
    .marker-controls button:hover,.copy-link:hover { border-color:rgba(230,90,79,.75); }
    .marker-readout { position:absolute; z-index:900; left:16px; right:16px; bottom:16px; width:min(620px,calc(100% - 32px)); padding:14px 16px; border:1px solid rgba(255,255,255,.12); border-left:3px solid #d52b1e; border-radius:12px; background:rgba(8,8,8,.9); backdrop-filter:blur(10px); }
    .marker-readout strong { display:block; font-size:1.02rem; }
    .marker-readout span { display:block; margin-top:4px; color:#b9b0a7; font-variant-numeric:tabular-nums; }
    .marker-loading { position:absolute; z-index:950; inset:0; display:grid; place-items:center; padding:30px; text-align:center; background:#080808; }
    .marker-loading[hidden] { display:none; }
    .marker-loading.error strong { color:#ff766b; }
    .marker-footer { border-radius:14px; padding:11px 15px; color:#8f8880; font-size:.82rem; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .marker-footer a { color:#d4ccc2; text-decoration:none; }
    .marker-footer a:hover { color:#fff; }
    @media (max-width:700px) { .marker-shell{padding:10px;grid-template-rows:auto minmax(500px,1fr) auto}.marker-card,#wwz-detection-map{min-height:500px}.marker-header{padding:14px}.marker-header img{width:44px;height:44px}.marker-controls{top:10px;left:10px}.marker-readout{left:10px;right:10px;bottom:10px;width:calc(100% - 20px)} }
  </style>
<link href="assets/css/ui-system.css?v=1.22.93&rev=unified-ui-1" rel="stylesheet"/>
</head>
<body>
  <main class="marker-shell">
    <header class="marker-header">
      <img src="assets/world-war-z-logo.webp" alt="World War Z">
      <div class="marker-header-copy">
        <p class="marker-kicker">World War Z · Zone Detection</p>
        <h1 data-marker-title>Detection Location</h1>
        <p class="marker-subtitle" data-marker-map>Loading DayZ map…</p>
      </div>
      <button class="copy-link" data-copy-coordinates type="button">Copy X/Z</button>
    </header>

    <section class="marker-card" aria-label="Zone detection location map">
      <div id="wwz-detection-map" tabindex="0" aria-label="Interactive DayZ map showing the detected zone location">
        <div class="marker-controls map-controls" aria-label="Map controls">
          <button type="button" data-marker-zoom-in aria-label="Zoom in">+</button>
          <button type="button" data-marker-zoom-out aria-label="Zoom out">−</button>
          <button type="button" data-marker-reset aria-label="Reset map">⌂</button>
          <button type="button" data-marker-fullscreen aria-label="Fullscreen map">⛶</button>
        </div>
        <div class="marker-readout">
          <strong data-marker-name>Detection marker</strong>
          <span data-marker-coordinates>X — · Z —</span>
        </div>
        <div class="marker-loading" data-marker-loading><strong>Loading WWZ map…</strong></div>
      </div>
    </section>

    <footer class="marker-footer">
      <span>Temporary Discord detection marker · no dashboard sign-in required</span>
      <a href="index.html">World War Z</a>
    </footer>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script src="assets/js/pwa.js?v=1.22.93"></script>
  <script src="assets/js/map/wwz-map.js?v=1.22.93&rev=3"></script>
  <script src="assets/js/pages/map-link.js?v=1.22.93"></script>
<script defer src="assets/js/ui-system.js?v=1.22.93&rev=unified-ui-1"></script>
</body>
</html>
